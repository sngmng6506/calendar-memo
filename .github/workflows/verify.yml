name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daymark
          POSTGRES_PASSWORD: daymark
          POSTGRES_DB: daymark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daymark -d daymark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://daymark:daymark@127.0.0.1:5432/daymark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
